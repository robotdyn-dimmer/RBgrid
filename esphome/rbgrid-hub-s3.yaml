# RBgrid hub firmware hosted by ESPHome (pilot) on an ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM).
# rbAmp bus: SDA GPIO8 / SCL GPIO9 (the S3 default in the RBgrid core).
esphome:
  name: rbgrid-hub-s3

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: partitions_rbgrid_esphome.csv
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0     # the board's UART-USB port (COM23)

api:
  reboot_timeout: 0s
  actions:
    # RBgrid configuration from Home Assistant, no YAML change: the RBgrid command format
    # ({"cmd":"get|set|history","section":...}). The reply comes back as the action's response.
    - action: rbgrid_cmd
      variables:
        command: string
      then:
        - api.respond:
            data: !lambda |-
              root["reply"] = id(rb).command(command);

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # ESP-NOW beacons and nodes need the radio awake
  reboot_timeout: 0s        # never restart the meter because Wi-Fi is down

# The system clock comes from ESPHome; RBgrid's tariff zones and days use RBgrid's own time zone (set through
# rbgrid_cmd, section "time"), not this one.
time:
  - platform: sntp
    id: sntp_time

external_components:
  - source:
      type: local
      path: components

rbgrid:
  id: rb
  point_slots: 12           # fixed grid; points take free slots at runtime, no YAML change
  power:
    name: "Grid power"
  energy_in:
    name: "Energy in"
  energy_out:
    name: "Energy out"
