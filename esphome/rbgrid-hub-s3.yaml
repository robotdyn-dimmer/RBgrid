# RBgrid hub firmware hosted by ESPHome (pilot) on an ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM).
# rbAmp bus: SDA GPIO8 / SCL GPIO9 (the S3 default in the RBgrid core).
esphome:
  name: rbgrid-hub-s3
  friendly_name: RBgrid Hub
  project:
    name: rbgrid.hub_s3
    version: 1.2.0-dev
  # one HA device per point slot (rbgrid: slot_devices: true); the user renames them in HA
  devices:
    - id: rbgrid_point_1
      name: "Point 1"
    - id: rbgrid_point_2
      name: "Point 2"
    - id: rbgrid_point_3
      name: "Point 3"
    - id: rbgrid_point_4
      name: "Point 4"
    - id: rbgrid_point_5
      name: "Point 5"
    - id: rbgrid_point_6
      name: "Point 6"
    - id: rbgrid_point_7
      name: "Point 7"
    - id: rbgrid_point_8
      name: "Point 8"
    - id: rbgrid_point_9
      name: "Point 9"
    - id: rbgrid_point_10
      name: "Point 10"
    - id: rbgrid_point_11
      name: "Point 11"
    - id: rbgrid_point_12
      name: "Point 12"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: partitions_rbgrid_esphome.csv
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0     # the board's UART-USB port (COM23)

api:
  reboot_timeout: 0s
  actions:
    # RBgrid configuration from Home Assistant, no YAML change: the RBgrid command format
    # ({"cmd":"get|set|history","section":...}). The reply comes back as the action's response.
    # Reply: {"ok", "schema", "type", "config_version", "data": <device reply object>}; a device error comes back as
    # the action's error (success: false + the device message), so HA raises instead of returning ok.
    - action: rbgrid_cmd
      variables:
        command: string
      then:
        - lambda: 'id(rb).run_command(command);'
        - api.respond:
            success: !lambda 'return id(rb).last_ok();'
            error_message: !lambda 'return id(rb).last_error();'
            data: !lambda 'id(rb).fill_reply(root);'


ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # ESP-NOW beacons and nodes need the radio awake
  reboot_timeout: 0s        # never restart the meter because Wi-Fi is down

# The system clock comes from ESPHome; RBgrid's tariff zones and days use RBgrid's own time zone (set through
# rbgrid_cmd, section "time"), not this one.
time:
  - platform: sntp
    id: sntp_time

external_components:
  - source:
      type: local
      path: components

rbgrid:
  id: rb
  point_slots: 12           # fixed grid; points take free slots at runtime, no YAML change
  slot_current: true        # + "Point N current" per slot
  slot_devices: true        # each slot's entities under the sub-device rbgrid_point_N (declared above)
  slot_cost: true           # + per-point cost (monetary, total) for the Energy dashboard
  currency: EUR             # label of the money entities = the tariff plan's currency (HA does not convert)
  power:
    name: "Grid power"
  energy_in:
    name: "Energy in"
  energy_out:
    name: "Energy out"
  energy_day_in:
    name: "Energy in today"
  energy_day_out:
    name: "Energy out today"
  cost_total:
    name: "Cost"
  revenue_total:
    name: "Export value"
  cost_day:
    name: "Cost today"
  revenue_day:
    name: "Export value today"
  buy_price:
    name: "Buy price"
  sell_price:
    name: "Sell price"
  tariff_zone:
    name: "Tariff zone"
  config_version:
    name: "Config version"
  time_valid:
    name: "Clock set"
  tariff_placeholder:
    name: "Demo tariff"
