# RBgrid hub firmware hosted by ESPHome (pilot). ESP32-WROVER, 16 MB flash, PSRAM.
esphome:
  name: rbgrid-hub

esp32:
  board: esp-wrover-kit
  flash_size: 16MB
  partitions: partitions_rbgrid_esphome.csv
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 40MHz

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # ESP-NOW beacons and nodes need the radio awake
  reboot_timeout: 0s        # never restart the meter because Wi-Fi is down

external_components:
  - source:
      type: local
      path: components

rbgrid:
  power:
    name: "Grid power"
  energy_in:
    name: "Energy in"
  energy_out:
    name: "Energy out"
